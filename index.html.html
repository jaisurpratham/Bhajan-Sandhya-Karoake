<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhajan Karaoke</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#e8edf7;--dim:#8fa0bf;--accent:#fbbf24;--fs:34px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:#18233d;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--accent)}
.fs{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px}
.fs input{width:110px;accent-color:var(--accent)}
#app{display:flex;height:calc(100% - 56px);position:relative}
aside{width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s}
aside .top{padding:10px;display:flex;gap:8px}
#q{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#list{flex:1;overflow:auto;padding:0 8px 8px}
.item{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:#18233d}
.item.on{background:#1b2a4a;border-color:var(--accent)}
.item b{display:block;font-size:15px;font-weight:700}
.item small{color:var(--dim);font-size:12px}
aside .foot{padding:8px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
aside .foot a{color:var(--dim);cursor:pointer;text-decoration:underline}
main{flex:1;position:relative;min-width:0}
#stage{height:100%;overflow-y:auto;scroll-behavior:auto;padding:45vh 5vw;text-align:center}
#stage::-webkit-scrollbar{width:0}
.ln{font-size:var(--fs);line-height:1.7;margin:.35em auto;max-width:1000px;opacity:.38;cursor:pointer;transition:opacity .25s,transform .25s,color .25s;transform:scale(.94)}
.ln.on{opacity:1;color:var(--accent);font-weight:700;transform:scale(1.1)}
.hd{text-align:center;color:var(--dim);margin:0 auto 6vh}
.hd h2{margin:0;font-size:calc(var(--fs)*.9);color:var(--text)}
.nav{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.nav button{width:56px;height:56px;border-radius:50%;background:#18233dcc;border:1px solid var(--line);font-size:22px;cursor:pointer}
.nav button:active{background:var(--accent);color:#000}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .25s}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(640px,94vw);padding:16px}
dialog::backdrop{background:#000a}
dialog input,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
dialog textarea{height:50vh;line-height:1.6}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#menu{display:none}
@media(max-width:800px){
 #menu{display:inline-block}
 aside{position:absolute;z-index:5;height:100%;transform:translateX(-100%);width:84%}
 aside.open{transform:none}
 .fs input{width:70px}.fs span{display:none}
 .nav{right:8px}.nav button{width:48px;height:48px}
}
</style>
</head>
<body>
<header>
 <button class="btn" id="menu" title="Songs">☰</button>
 <h1 id="ttl">Bhajan Karaoke</h1>
 <label class="fs"><span>Size</span><button class="btn" id="fm">−</button><input id="fz" type="range" min="18" max="90" value="34"><button class="btn" id="fp">+</button></label>
 <button class="btn" id="edit" title="Edit lyrics">✎</button>
 <button class="btn" id="full" title="Fullscreen (F)">⛶</button>
</header>
<div id="app">
 <aside id="side">
  <div class="top"><input id="q" type="search" placeholder="Search title or first line…"><button class="btn" id="new" title="Add bhajan">＋</button></div>
  <div id="list"></div>
  <div class="foot"><span>Space/↓ next · ↑ prev · R reset</span><a id="reset">Reset data</a></div>
 </aside>
 <main>
  <div id="stage"></div>
  <div class="nav"><button id="up" aria-label="Previous">↑</button><button id="dn" aria-label="Next">↓</button></div>
  <div id="prog"></div>
 </main>
</div>
<dialog id="dlg">
 <input id="et" placeholder="Title">
 <input id="es" placeholder="Subtitle (optional)">
 <textarea id="el" placeholder="One lyric line per row"></textarea>
 <div class="row"><button class="btn" id="edel" style="margin-right:auto">Delete</button><button class="btn" id="ecan">Cancel</button><button class="btn" id="esave" style="border-color:var(--accent)">Save</button></div>
</dialog>

/* ---------------------------------------------------------------------------------------- */
const KEY='bhajan_songs_v1';
const $=id=>document.getElementById(id);
let songs=load(), cur=songs[0]?.id, idx=0, editing=null;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length)return s}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_SONGS))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(songs))}catch(e){}}
const song=()=>songs.find(s=>s.id===cur)||songs[0];

function renderList(){
 const t=$('q').value.trim().toLowerCase();
 $('list').innerHTML='';
 songs.filter(s=>!t||(s.title+' '+(s.subtitle||'')+' '+(s.lines[0]||'')).toLowerCase().includes(t)).forEach(s=>{
  const d=document.createElement('div');d.className='item'+(s.id===cur?' on':'');
  d.innerHTML='<b></b><small></small>';d.firstChild.textContent=s.title;d.lastChild.textContent=s.subtitle||'';
  d.onclick=()=>{openSong(s.id);$('side').classList.remove('open')};
  $('list').appendChild(d);
 });
}
function openSong(id){cur=id;idx=0;renderSong();renderList()}
function renderSong(){
 const s=song();if(!s){$('stage').innerHTML='';return}
 $('ttl').textContent=s.title;
 const st=$('stage');st.innerHTML='';
 const h=document.createElement('div');h.className='hd';
 h.innerHTML='<h2></h2><div></div>';h.firstChild.textContent=s.title;h.lastChild.textContent=s.subtitle||'';
 st.appendChild(h);
 s.lines.forEach((l,i)=>{const p=document.createElement('div');p.className='ln';p.textContent=l;p.onclick=()=>go(i);st.appendChild(p)});
 st.scrollTop=0;go(0,true);
}
function go(i,instant){
 const s=song();if(!s||!s.lines.length)return;
 idx=Math.max(0,Math.min(s.lines.length-1,i));
 const els=document.querySelectorAll('.ln');
 els.forEach((e,k)=>e.classList.toggle('on',k===idx));
 $('prog').style.width=((idx+1)/s.lines.length*100)+'%';
 center(instant);
}
function center(instant){
 const e=document.querySelectorAll('.ln')[idx],st=$('stage');if(!e)return;
 const r=e.getBoundingClientRect(),sr=st.getBoundingClientRect();
 const top=st.scrollTop+(r.top-sr.top)-sr.height/2+r.height/2;
 st.scrollTo({top:Math.max(0,top),behavior:instant?'auto':'smooth'});
}
function setFs(v){v=Math.max(18,Math.min(90,+v));document.documentElement.style.setProperty('--fs',v+'px');$('fz').value=v;setTimeout(()=>center(true),60)}
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}

document.addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea')||$('dlg').open)return;
 const k=e.key;
 if([' ','ArrowDown','PageDown'].includes(k)){e.preventDefault();go(idx+1)}
 else if(['ArrowUp','PageUp'].includes(k)){e.preventDefault();go(idx-1)}
 else if(k==='Home'||k==='r'||k==='R'){e.preventDefault();go(0)}
 else if(k==='End'){e.preventDefault();go(1e9)}
 else if(k==='f'||k==='F'){toggleFull()}
});
$('dn').onclick=()=>go(idx+1);$('up').onclick=()=>go(idx-1);
$('fz').oninput=e=>setFs(e.target.value);
$('fp').onclick=()=>setFs(+$('fz').value+4);$('fm').onclick=()=>setFs(+$('fz').value-4);
$('full').onclick=toggleFull;
$('menu').onclick=()=>$('side').classList.toggle('open');
$('q').oninput=renderList;
window.addEventListener('resize',()=>center(true));

/* editor: stored in this browser's localStorage */
function openEditor(s){
 editing=s;$('et').value=s?s.title:'';$('es').value=s?s.subtitle||'':'';$('el').value=s?s.lines.join('\n'):'';
 $('edel').style.display=s?'':'none';$('dlg').showModal();
}
$('edit').onclick=()=>openEditor(song());
$('new').onclick=()=>openEditor(null);
$('ecan').onclick=()=>$('dlg').close();
$('esave').onclick=()=>{
 const lines=$('el').value.split('\n').map(l=>l.trim()).filter(Boolean),title=$('et').value.trim()||'Untitled';
 if(editing){Object.assign(editing,{title,subtitle:$('es').value.trim(),lines});cur=editing.id}
 else{const n={id:'c'+Date.now(),title,subtitle:$('es').value.trim(),lines};songs.push(n);cur=n.id}
 save();$('dlg').close();idx=0;renderSong();renderList();
};
$('edel').onclick=()=>{
 if(!editing||!confirm('Delete this bhajan?'))return;
 songs=songs.filter(s=>s!==editing);cur=songs[0]?.id;save();$('dlg').close();renderSong();renderList();
};
$('reset').onclick=()=>{
 if(!confirm('Discard all edits and restore the original PDF lyrics?'))return;
 try{localStorage.removeItem(KEY)}catch(e){}
 songs=load();cur=songs[0]?.id;renderSong();renderList();
};
renderList();renderSong();
</script>
